<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name + ' - Product Details'}">Product Details - WEBDEV2 Week 5</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; }

        /* Navbar Fragment Styles */
        .site-header { background: #0f172a; border-bottom: 1px solid #1e293b; color: #fff; }
        .nav-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 1.5rem; }
        .nav-brand { display: flex; align-items: center; gap: 0.65rem; color: #fff; text-decoration: none; font-weight: 700; font-size: 1.2rem; }
        .brand-badge { background: #3b82f6; color: #fff; padding: 0.2rem 0.55rem; border-radius: 6px; font-size: 0.75rem; letter-spacing: 0.5px; }
        .nav-menu { display: flex; align-items: center; gap: 0.85rem; }
        .nav-link { color: #cbd5e1; text-decoration: none; font-size: 0.95rem; font-weight: 500; padding: 0.45rem 0.85rem; border-radius: var(--radius); transition: all 0.2s; }
        .nav-link:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
        .nav-btn-primary { background: #2563eb; color: #fff !important; }
        .nav-btn-primary:hover { background: #1d4ed8 !important; }
        .nav-btn-outline { border: 1px solid #475569; color: #94a3b8 !important; }
        .nav-btn-outline:hover { border-color: #cbd5e1; color: #fff !important; }

        /* Main Container */
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; }
        .breadcrumb { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.25rem; }
        .breadcrumb a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .breadcrumb a:hover { text-decoration: underline; }

        /* Detail Card */
        .detail-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border);
            padding: 2.25rem;
        }
        .header-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; }
        .product-title { font-size: 2rem; font-weight: 700; color: #0f172a; line-height: 1.2; }
        .product-id-tag { background: #f1f5f9; color: #475569; font-weight: 600; padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.875rem; }

        .price-badge {
            font-size: 1.85rem;
            font-weight: 800;
            color: #059669;
            margin: 1rem 0 1.5rem 0;
            font-variant-numeric: tabular-nums;
        }

        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            background: #f8fafc;
            padding: 1.25rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }
        .attribute-item label { display: block; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        .attribute-item .val { font-size: 1rem; font-weight: 600; color: #1e293b; }

        .desc-box { margin-bottom: 2rem; }
        .desc-box h4 { font-size: 0.9rem; text-transform: uppercase; font-weight: 600; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 0.5rem; }
        .desc-box p { font-size: 1rem; color: #334155; line-height: 1.6; }

        /* Card Actions */
        .card-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        .left-actions, .right-actions { display: flex; gap: 0.75rem; align-items: center; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.65rem 1.2rem;
            border-radius: 6px;
            font-size: 0.925rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s;
        }
        .btn-outline { background: #fff; color: #334155; border-color: var(--border); }
        .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn-edit { background: var(--primary); color: #fff; }
        .btn-edit:hover { background: var(--primary-hover); }
        .btn-delete { background: #fef2f2; color: var(--danger); border-color: #fecaca; }
        .btn-delete:hover { background: #fee2e2; color: var(--danger-hover); }
    </style>
</head>
<body>

    <!-- Shared Navigation Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container">
        <!-- Breadcrumb Navigation -->
        <nav class="breadcrumb">
            <a th:href="@{/products}">Products</a>
            <span>›</span>
            <span th:text="${product.name}">Product Name</span>
        </nav>

        <div class="detail-card">
            <div class="header-meta">
                <h1 class="product-title" th:text="${product.name}">Product Name</h1>
                <span class="product-id-tag" th:text="${'ID: #' + product.id}">ID: #1</span>
            </div>

            <div class="price-badge" th:text="${'$' + #numbers.formatDecimal(product.price, 1, 2)}">
                $0.00
            </div>

            <!-- Structured attributes grid -->
            <div class="attributes-grid">
                <div class="attribute-item">
                    <label>Category</label>
                    <div class="val" th:text="${product.category}">Category Name</div>
                </div>
                <div class="attribute-item">
                    <label>Stock Level</label>
                    <div class="val" th:text="${product.stockQuantity + ' Units Available'}">25 Units</div>
                </div>
            </div>

            <div class="desc-box">
                <h4>Description & Specifications</h4>
                <p th:text="${product.description != null && !product.description.isBlank() ? product.description : 'No extended description provided.'}">
                    Product description details...
                </p>
            </div>

            <div class="card-actions">
                <div class="left-actions">
                    <a th:href="@{/products}" class="btn btn-outline">← Back to Catalog</a>
                </div>
                <div class="right-actions">
                    <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-edit">✏️ Edit Product</a>
                    <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post" style="display: inline;"
                          onsubmit="return confirm('Are you sure you want to permanently delete this product?');">
                        <button type="submit" class="btn btn-delete">🗑️ Delete Product</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
